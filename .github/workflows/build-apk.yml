name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Project Zip if Uploaded Directly
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ -f "NiagaraCloneLauncher.zip" ]; then
            echo "Found NiagaraCloneLauncher.zip in root, extracting..."
            unzip -o NiagaraCloneLauncher.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.11.1 & Generate Wrapper if Missing
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle Wrapper & Build Debug APK
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiagaraCloneLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
